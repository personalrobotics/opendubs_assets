#
# node.yaml with the hands: openarm_assets' node_hands.yaml (a posture stage per hand, track_right_hand / track_left_hand / track_all)
# on the whole robot. On hardware each hand needs its `openarm_hand` entry in the hardware config (openarm-driver).
#
#   gafro-robot-node --config src/opendubs_assets/configs/node_hands.yaml --transport local --run-for 10
extends: openarm_assets:configs/node_hands.yaml

robot:
  model: ../models/generated/opendubs.xml
